name: fraud-detection-platform

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_TRANSACTIONS: transactions.raw
  KAFKA_TOPIC_DLQ: transactions.dlq
  SPARK_MASTER_URL: spark://spark-master:7077
  SPARK_CHECKPOINT_DIR: /tmp/checkpoints/transactions
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: fraud_detection
  POSTGRES_USER: fraud_admin
  POSTGRES_PASSWORD: change_me_in_prod
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PROMETHEUS_PORT: "8000"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: fraud-detection
  MLFLOW_XGBOOST_MODEL_NAME: fraud_xgboost
  MLFLOW_LIGHTGBM_MODEL_NAME: fraud_lightgbm
  MLFLOW_ACTIVE_MODEL_NAME: fraud_xgboost

services:
  # --- Streaming backbone ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "fraud-detection-kraft-cluster-1"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- Spark ---
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: fraud-spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: fraud-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master

  # --- Storage ---
  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_admin
      POSTGRES_PASSWORD: change_me_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_admin -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services ---
  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: fraud-producer
    environment:
      <<: *common-env
      PRODUCER_TPS: "200"
      PRODUCER_EDGE_CASE_RATIO: "0.05"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8001:8000"

  consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    container_name: fraud-consumer
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-master:
        condition: service_started
    ports:
      - "8002:8000"

  # --- ML: tracking + registry ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: fraud-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-off training job. Not started by `docker compose up`; run explicitly
  # with `docker compose --profile training run --rm training` after mlflow
  # and postgres are up, whenever you want to (re)train and register models.
  training:
    build:
      context: .
      dockerfile: docker/training/Dockerfile
    container_name: fraud-training
    profiles: ["training"]
    environment:
      <<: *common-env
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --- Real-time inference API ---
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: fraud-api
    environment:
      <<: *common-env
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  # --- Analyst review UI ---
  review-ui:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: fraud-review-ui
    environment:
      <<: *common-env
      FRAUD_API_BASE_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "8501:8501"

  # --- Observability ---
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: fraud-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: fraud-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  mlflow-data:
