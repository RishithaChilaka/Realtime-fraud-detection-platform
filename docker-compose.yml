name: fraud-detection-platform

# No host-path bind mounts anywhere in this file, on purpose: if this repo
# lives under a path containing a colon (e.g. a folder named "ai:ml
# project"), Docker Desktop's host-path-to-container translation breaks on
# the colon regardless of whether the volume is written in short form
# ("./host:./container:ro") or long form ("type: bind / source: / target:").
# Every service that needs a local config file or directory (postgres init
# script, prometheus/alertmanager config, grafana provisioning/dashboards,
# airflow dags) bakes it into a custom image at build time instead -- see
# docker/postgres/Dockerfile, docker/prometheus/Dockerfile,
# docker/alertmanager/Dockerfile, docker/grafana/Dockerfile, and
# docker/airflow/Dockerfile. Only named volumes (no host path involved) are
# used for actual runtime state.

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_TRANSACTIONS: transactions.raw
  KAFKA_TOPIC_DLQ: transactions.dlq
  SPARK_MASTER_URL: spark://spark-master:7077
  SPARK_CHECKPOINT_DIR: /tmp/checkpoints/transactions
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: fraud_detection
  POSTGRES_USER: fraud_admin
  POSTGRES_PASSWORD: change_me_in_prod
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PROMETHEUS_PORT: "8000"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: fraud-detection
  MLFLOW_XGBOOST_MODEL_NAME: fraud_xgboost
  MLFLOW_LIGHTGBM_MODEL_NAME: fraud_lightgbm
  MLFLOW_ACTIVE_MODEL_NAME: fraud_xgboost
  PUSHGATEWAY_URL: pushgateway:9091
  JWT_SECRET_KEY: change_me_in_prod_use_secrets_manager

services:
  # --- Streaming backbone ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "fraud-detection-kraft-cluster-1"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- Spark ---
  spark-master:
    # Bitnami pulled all free `bitnami/*` images off Docker Hub in Aug 2025 and
    # moved existing pinned tags to `bitnamilegacy/*` (frozen, no further
    # updates). Same image content, just a renamed namespace.
    image: bitnamilegacy/spark:3.5.1
    container_name: fraud-spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    # See spark-master's image comment above -- same Bitnami namespace migration.
    image: bitnamilegacy/spark:3.5.1
    container_name: fraud-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master

  # --- Storage ---
  postgres:
    # Custom image (docker/postgres/Dockerfile) bakes in sql/init.sql at
    # build time instead of bind-mounting it -- see that Dockerfile's
    # comment for why (host paths containing a colon break Docker
    # Desktop's runtime bind-mount translation).
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_admin
      POSTGRES_PASSWORD: change_me_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_admin -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services ---
  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: fraud-producer
    environment:
      <<: *common-env
      PRODUCER_TPS: "200"
      PRODUCER_EDGE_CASE_RATIO: "0.05"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8001:8000"

  consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    container_name: fraud-consumer
    environment:
      <<: *common-env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-master:
        condition: service_started
    ports:
      - "8002:8000"

  # --- ML: tracking + registry ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: fraud-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      # Host port 5001, not 5000: macOS's built-in AirPlay Receiver listens
      # on 5000 by default, so binding it here fails with "address already
      # in use" on most Macs. The container still listens on 5000
      # internally -- other services reach it at http://mlflow:5000 over
      # the compose network, unaffected by this; only the host-side URL
      # changes (http://localhost:5001).
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-off training job. Not started by `docker compose up`; run explicitly
  # with `docker compose --profile training run --rm training` after mlflow
  # and postgres are up, whenever you want to (re)train and register models.
  training:
    build:
      context: .
      dockerfile: docker/training/Dockerfile
    container_name: fraud-training
    profiles: ["training"]
    environment:
      <<: *common-env
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --- Real-time inference API ---
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: fraud-api
    environment:
      <<: *common-env
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host port 8090, not 8080: spark-master's UI already claims 8080:8080
      # above. The container still listens on 8080 (API_PORT=8080) --
      # unaffected internally (review-ui reaches it at http://api:8080 over
      # the compose network); this only changes the host-side mapping.
      - "8090:8080"

  # --- Analyst review UI ---
  review-ui:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: fraud-review-ui
    environment:
      <<: *common-env
      FRAUD_API_BASE_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "8501:8501"

  # --- Observability ---
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: fraud-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: fraud-pushgateway
    ports:
      - "9091:9091"

  # Custom images (docker/prometheus, docker/alertmanager, docker/grafana)
  # bake in their config/dashboards at build time instead of bind-mounting
  # them -- see docker/postgres/Dockerfile's comment for why.
  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus/Dockerfile
    container_name: fraud-prometheus
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    build:
      context: .
      dockerfile: docker/alertmanager/Dockerfile
    container_name: fraud-alertmanager
    ports:
      - "9093:9093"

  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    container_name: fraud-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # --- Orchestration: Airflow (retraining, drift detection, promotion, business metrics) ---
  airflow-postgres:
    image: postgres:16-alpine
    container_name: fraud-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: fraud-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    environment: &airflow-env
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: change_me_in_prod
    volumes:
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: fraud-airflow-webserver
    command: webserver
    environment:
      <<: *airflow-env
    volumes:
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8793:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: fraud-airflow-scheduler
    command: scheduler
    environment:
      <<: *airflow-env
    volumes:
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  mlflow-data:
  airflow-postgres-data:
  airflow-logs:
