name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 src tests

      - name: black --check
        run: black --check src tests

      - name: isort --check-only
        run: |
          python --version
          isort --version-number
          isort --check-only --diff src tests

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system deps for confluent-kafka
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest tests/unit -v -m unit --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system deps for confluent-kafka
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install system deps for xgboost/lightgbm
        run: sudo apt-get install -y libgomp1

      - name: Run integration tests (Kafka/PostgreSQL/Redis via testcontainers,
          FastAPI /score + /explain against a real trained XGBoost model)
        run: pytest tests/integration -v -m integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [producer, consumer, api, training, streamlit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: false
          tags: fraud-${{ matrix.service }}:ci

  compose-config:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config -q
