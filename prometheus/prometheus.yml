global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fraud-producer"
    static_configs:
      - targets: ["producer:8000"]

  - job_name: "fraud-consumer"
    static_configs:
      - targets: ["consumer:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
